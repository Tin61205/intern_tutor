# Giới hạn worker process theo số CPU core
worker_processes auto;

events {
    # Số kết nối tối đa mỗi worker có thể xử lý đồng thời
    worker_connections 1024;
}

http {
    # Tối ưu hóa việc gửi file
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Ẩn version của Nginx trên header (Security)
    server_tokens off;

    # Load danh sách MIME types (định dạng file)
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Bật nén GZIP để giảm dung lượng băng thông, tăng tốc API
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Định nghĩa Backend Upstream (trỏ tới container FastAPI)
    upstream fastapi_backend {
        server api:8000;
    }

    server {
        # Lắng nghe port 80 (Sau này có HTTPS sẽ lắng nghe thêm 443)
        listen 80;
        server_name _; # Nhận mọi domain

        # Security Headers bảo vệ ứng dụng khỏi các cuộc tấn công phổ biến
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Điểm đầu vào chính cho toàn bộ API
        location / {
            proxy_pass http://fastapi_backend;
            
            # Giữ nguyên các thông tin gốc của Client truyền vào Backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tăng timeout tránh lỗi khi hệ thống xử lý logic nặng
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Cấu hình riêng biệt để phục vụ Static Files (Ví dụ hình ảnh upload) nếu có
        # location /static/ {
        #     alias /var/www/static/;
        #     expires 30d;
        # }
    }
}
